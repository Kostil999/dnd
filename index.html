<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
  <meta name="theme-color" content="#1b1420">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="ДнД Мастер">
  <title>ДнД Мастер</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header id="topbar">
    <h1 id="title">ДнД Мастер</h1>
    <div id="top-actions"></div>
  </header>

  <main>
    <section id="tab-game" class="tab active"></section>
    <section id="tab-chars" class="tab"></section>
    <section id="tab-dice" class="tab"></section>
    <section id="tab-rules" class="tab"></section>
    <section id="tab-settings" class="tab"></section>
  </main>

  <nav id="tabbar">
    <button data-tab="game" class="active"><span>🐉</span>Игра</button>
    <button data-tab="chars"><span>🧝</span>Герои</button>
    <button data-tab="dice"><span>🎲</span>Кубики</button>
    <button data-tab="rules"><span>📜</span>Правила</button>
    <button data-tab="settings"><span>⚙️</span>Настройки</button>
  </nav>

  <div id="modal" class="hidden"></div>
  <div id="toast" class="hidden"></div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
